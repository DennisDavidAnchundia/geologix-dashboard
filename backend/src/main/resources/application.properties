# ============================================================
# GeoLogix Dashboard - Backend
# Configuración de desarrollo (perfil por defecto)
# Usa H2 en memoria para arrancar al instante sin Docker.
# El perfil 'docker' conecta a PostgreSQL/PostGIS (ver más abajo).
# ============================================================

spring.application.name=geologix-backend

# --- Servidor ---
server.port=8080

# --- Base de datos: H2 en memoria (desarrollo rápido) ---
spring.datasource.url=jdbc:h2:mem:geologix;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# create-drop: recrea el esquema en cada arranque (suficiente para la demo)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Consola H2 (para inspeccionar datos en dev): http://localhost:8080/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Las fechas se serializan en ISO 8601 vía la configuración de Jackson por defecto.

# --- Simulación GPS ---
# Tamaño de la flota de demostración
simulation.vehicle-count=4
# Intervalo (ms) entre actualizaciones de posición por vehículo
simulation.tick-interval-ms=2000
# Límite de velocidad (km/h) que dispara una alerta de exceso
simulation.speed-limit-kmh=80
# Tiempo (ms) de detención que dispara una alerta de detención prolongada
simulation.stop-threshold-ms=60000
# Velocidad (km/h) por debajo de la cual el vehículo se considera detenido
simulation.stopped-threshold-kmh=2

# --- Logging ---
logging.level.com.geologix=INFO

# ============================================================
