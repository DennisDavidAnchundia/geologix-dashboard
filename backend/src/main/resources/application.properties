# ============================================================
# GeoLogix Dashboard - Backend
# Configuración por defecto: PostgreSQL con PostGIS (Docker).
# Levantar la base primero: docker compose up -d postgis
# Perfil alternativo sin Docker: --spring.profiles.active=h2 (limitado)
# ============================================================

spring.application.name=geologix-backend

# --- Servidor ---
server.port=${PORT:8080}

# --- Base de datos: PostgreSQL + PostGIS ---
# Local dev: localhost:5433 (Docker mapea 5433 por el Postgres local en 5432).
# Prod/Docker: SPRING_DATASOURCE_URL=jdbc:postgresql://postgis:5432/geologix
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/geologix}
spring.datasource.username=${SPRING_DATASOURCE_USER:geologix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:geologix}

# --- JPA / Hibernate ---
# update: adapta el esquema a las entidades sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Dialecto explícito: evita "Unable to determine Dialect" en Render/Supabase
# y deja ver el error real de conexión si la URL falla.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Simulación GPS ---
# Tamaño de la flota de demostración
simulation.vehicle-count=4
# Intervalo (ms) entre actualizaciones de posición por vehículo
simulation.tick-interval-ms=2000
# Límite de velocidad (km/h) que dispara una alerta de exceso
simulation.speed-limit-kmh=80
# Tiempo (ms) de detención que dispara una alerta de detención prolongada
simulation.stop-threshold-ms=60000
# Velocidad (km/h) por debajo de la cual el vehículo se considera detenido
simulation.stopped-threshold-kmh=2

# --- Logging ---
logging.level.com.geologix=INFO

# --- Actuator (healthcheck para Render) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Seguridad JWT ---
# En prod: pasar por variable de entorno SECURITY_JWT_SECRET (>=32 chars).
security.jwt.secret=${SECURITY_JWT_SECRET:geologix-dev-secret-min-32-chars-1234567890}
security.jwt.expiration-ms=86400000

# --- CORS ---
# Vacío = solo mismo origen + localhost (dev). En prod con frontend separado
# (ej. S3), listar orígenes: CORS_ALLOWED_ORIGINS=https://app.example.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
