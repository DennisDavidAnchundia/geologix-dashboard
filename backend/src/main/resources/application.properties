# ============================================================
# GeoLogix Dashboard - Backend
# Configuración por defecto: PostgreSQL con PostGIS (Docker).
# Levantar la base primero: docker compose up -d postgis
# Perfil alternativo sin Docker: --spring.profiles.active=h2 (limitado)
# ============================================================

spring.application.name=geologix-backend

# --- Servidor ---
server.port=8080

# --- Base de datos: PostgreSQL + PostGIS ---
# Puerto 5433 en el host (el contenedor expone 5432 internamente); 5432 lo usa un
# PostgreSQL local de Windows.
spring.datasource.url=jdbc:postgresql://localhost:5433/geologix
spring.datasource.username=geologix
spring.datasource.password=geologix

# --- JPA / Hibernate ---
# update: adapta el esquema a las entidades sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Simulación GPS ---
# Tamaño de la flota de demostración
simulation.vehicle-count=4
# Intervalo (ms) entre actualizaciones de posición por vehículo
simulation.tick-interval-ms=2000
# Límite de velocidad (km/h) que dispara una alerta de exceso
simulation.speed-limit-kmh=80
# Tiempo (ms) de detención que dispara una alerta de detención prolongada
simulation.stop-threshold-ms=60000
# Velocidad (km/h) por debajo de la cual el vehículo se considera detenido
simulation.stopped-threshold-kmh=2

# --- Logging ---
logging.level.com.geologix=INFO
