# ============================================================
# GeoLogix Dashboard - Backend
# Configuración de desarrollo (perfil por defecto)
# Usa H2 en memoria para arrancar al instante sin Docker.
# El perfil 'docker' conecta a PostgreSQL/PostGIS (ver más abajo).
# ============================================================

spring.application.name=geologix-backend

# --- Servidor ---
server.port=8080

# --- Base de datos: H2 en memoria (desarrollo rápido) ---
spring.datasource.url=jdbc:h2:mem:geologix;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- JPA / Hibernate ---
# create-drop: recrea el esquema en cada arranque (suficiente para la demo)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Consola H2 (para inspeccionar datos en dev): http://localhost:8080/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# --- Logging ---
logging.level.com.geologix=INFO

# ============================================================
# Perfil de producción/Docker con PostgreSQL + PostGIS
# Activar con: --spring.profiles.active=docker
# (Se usa a partir de la Fase 3)
