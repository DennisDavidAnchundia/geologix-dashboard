# GeoLogix — despliegue completo (prod): PostGIS + backend + frontend.
# Uso local:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
# En servidor: copiar este archivo + .env y levantar igual (ver infra/aws/).
services:
  postgis:
    image: postgis/postgis:17-3.4
    container_name: geologix-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geologix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geologix}
      POSTGRES_DB: ${POSTGRES_DB:-geologix}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geologix} -d ${POSTGRES_DB:-geologix}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: geologix-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/${POSTGRES_DB:-geologix}
      SPRING_DATASOURCE_USER: ${POSTGRES_USER:-geologix}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-geologix}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-geologix-dev-secret-min-32-chars-1234567890}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    container_name: geologix-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
