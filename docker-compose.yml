services:
  postgis:
    image: postgis/postgis:17-3.4
    container_name: geologix-postgis
    environment:
      POSTGRES_USER: geologix
      POSTGRES_PASSWORD: geologix
      POSTGRES_DB: geologix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geologix -d geologix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
