# GeoLogix frontend: estáticos + proxy mismo-origen al backend (evita CORS).
# El upstream se resuelve en cada petición (no al arrancar): tolera que el
# backend aún no esté arriba y sus reinicios.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8080;

    # API REST
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket STOMP
    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA: todo lo demás sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
